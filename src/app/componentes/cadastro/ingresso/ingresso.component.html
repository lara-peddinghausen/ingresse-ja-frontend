<div class="ingresso-cadastro-container">
    <mat-card>
        <mat-card-header>
            <mat-card-title>Cadastro de Novo Ingresso</mat-card-title>
        </mat-card-header>

        <mat-card-content>
            <form [formGroup]="ingressoForm" (ngSubmit)="onSubmit()">
                
                <mat-form-field appearance="outline" class="full-width-input">
                    <mat-label>Tipo de Ingresso</mat-label>
                    <mat-select formControlName="tipoIngresso">
                        <mat-option *ngFor="let tipo of tiposIngresso" [value]="tipo">
                            {{ tipo }}
                        </mat-option>
                    </mat-select>
                    <mat-error *ngIf="ingressoForm.get('tipoIngresso')?.hasError('required')">
                        O tipo de ingresso é obrigatório.
                    </mat-error>
                </mat-form-field>
                
                <mat-form-field appearance="outline" class="full-width-input">
                    <mat-label>ID do Evento</mat-label>
                    <input matInput formControlName="eventoId" type="number" placeholder="Ex: 1">
                    <mat-error *ngIf="ingressoForm.get('eventoId')?.hasError('required')">
                        O ID do evento é obrigatório.
                    </mat-error>
                    <mat-error *ngIf="ingressoForm.get('eventoId')?.hasError('min')">
                        O ID do evento deve ser um número válido.
                    </mat-error>
                </mat-form-field>
                
                <mat-card-actions>
                    <button mat-raised-button color="primary" type="submit" [disabled]="ingressoForm.invalid || loading">
                        {{ loading ? 'Salvando...' : 'Salvar Ingresso' }}
                    </button>
                    <button mat-button type="button" (click)="voltar()">
                        Cancelar
                    </button>
                </mat-card-actions>
            </form>
        </mat-card-content>
    </mat-card>
</div>
